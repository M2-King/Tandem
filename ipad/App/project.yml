# Xcode project for Tandem on iPad, generated with XcodeGen (`xcodegen generate`).
# The web app (dist/) and Pyodide are copied into Resources/web by ipad/build.sh.
name: Tandem
options:
  bundleIdPrefix: app.tandem
  deploymentTarget:
    iOS: "16.4"
# Projects on an SSH server (SSHSession.swift): Citadel, an SSH client built
# on SwiftNIO SSH, pinned; the other three are what it builds on, named here
# because the app uses them directly. swift-nio-ssh comes from the fork
# Citadel itself uses (its author's), with the same version range.
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.11.1
  swift-nio-ssh:
    url: https://github.com/Joannis/swift-nio-ssh
    minorVersion: 0.3.4
  swift-nio:
    url: https://github.com/apple/swift-nio
    majorVersion: 2.65.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto
    majorVersion: 3.12.3
targets:
  Tandem:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/web
        type: folder
        buildPhase: resources
      # What Tandem installs on SSH servers (runtime wheel, bootstrap.sh, constraints.txt).
      - path: Resources/remote
        type: folder
        buildPhase: resources
    dependencies:
      - package: Citadel
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-crypto
        product: Crypto
    info:
      path: Resources/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleDevelopmentRegion: en
        LSRequiresIPhoneOS: true
        CFBundleDisplayName: Tandem
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSPhotoLibraryUsageDescription: "Choose a photo to use as Tandem's background."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tandem.ipad
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        DEVELOPMENT_TEAM: ""

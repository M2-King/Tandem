name: Bundled runtime check (temporary)
on:
  push:
    branches: [claude/tandem-cowork-staging-verify-7kd94b]
    paths: [packaging/tandem-runtime.spec, packaging/windows/smoke.py, runtime/tandem_runtime/terminals.py, .github/workflows/runtime-bundle-experiment.yml]
jobs:
  try:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python -m pip install ./runtime "pyinstaller==6.11.1"
          pyinstaller --noconfirm --distpath out --workpath build-pyi packaging/tandem-runtime.spec
          Get-ChildItem -Recurse out/tandem-runtime/_internal/winpty | Select-Object -ExpandProperty Name
      - shell: pwsh
        run: |
          python -m venv smoke-project-env
          smoke-project-env/Scripts/python.exe -m pip install --quiet numpy pandas matplotlib ipykernel
          python packaging/windows/smoke.py out/tandem-runtime/tandem-runtime.exe (Resolve-Path smoke-project-env/Scripts/python.exe).Path

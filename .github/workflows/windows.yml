name: Windows app

# Tests the runtime on Windows, builds the Tandem desktop app (installer and
# portable exe) with the Python runtime inside, and checks it end to end.
# Pushing a tag like v0.1.0, or running the workflow by hand with a release tag,
# also publishes the exe as a GitHub release.
#
# The cowork branch builds "Tandem Staging": Cowork in live mode against the
# staging Supabase project, installed beside the regular Tandem, kept as a
# workflow artifact. Each staging build has its own version
# (0.3.1-staging.<run number>) and, once every check has passed, replaces the
# files of the rolling prerelease windows-staging, which installed copies of
# Tandem Staging update from (publish-staging).

on:
  push:
    branches: [main, dusk-glass-style, cowork]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (for example v0.1.0); leave empty to only build"
        required: false
        default: ""

permissions:
  contents: read

# Cowork staging (docs/cowork-backend.md): repository variables for the app
# build. On the cowork branch the build stops unless all three are set; the
# key must be the Supabase publishable key, never a secret one.
env:
  VITE_COWORK_MODE: ${{ vars.VITE_COWORK_MODE }}
  VITE_TANDEM_SUPABASE_URL: ${{ vars.VITE_TANDEM_SUPABASE_URL }}
  VITE_TANDEM_SUPABASE_KEY: ${{ vars.VITE_TANDEM_SUPABASE_KEY }}
  VITE_TANDEM_ACCOUNT_DOMAIN: ${{ vars.VITE_TANDEM_ACCOUNT_DOMAIN }} # optional
  # Staging opens on the projects page (shared projects, and this device's project).
  VITE_COWORK_START: ${{ github.ref == 'refs/heads/cowork' && 'shared' || '' }}

jobs:
  test:
    name: Runtime tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py311
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v5
        id: py312
        with:
          python-version: "3.12"

      - name: Project environments for the tests (3.11 and 3.12)
        shell: pwsh
        run: |
          & "${{ steps.py311.outputs.python-path }}" -m venv runtime/.test-envs/py311
          & "${{ steps.py312.outputs.python-path }}" -m venv runtime/.test-envs/py312
          foreach ($v in "py311", "py312") {
            & "runtime/.test-envs/$v/Scripts/python.exe" -m pip install --quiet numpy pandas matplotlib ipykernel
          }

      - name: Install the runtime
        run: python -m pip install -e "runtime[test]"

      - name: Run the tests
        working-directory: runtime
        run: python -m pytest -v

  build:
    name: Build the desktop app
    needs: test
    runs-on: windows-latest
    outputs:
      staging_version: ${{ steps.staging.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Cowork staging settings
        if: github.ref == 'refs/heads/cowork'
        run: node packaging/check-cowork-staging.mjs
      - name: Build the UI
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bundle the Python runtime
        run: |
          python -m pip install ./runtime "pyinstaller==6.11.1"
          pyinstaller --noconfirm --distpath out --workpath build-pyi packaging/tandem-runtime.spec

      - name: Check the bundled runtime
        shell: pwsh
        run: |
          python -m venv smoke-project-env
          smoke-project-env/Scripts/python.exe -m pip install --quiet numpy pandas matplotlib ipykernel
          python packaging/windows/smoke.py out/tandem-runtime/tandem-runtime.exe (Resolve-Path smoke-project-env/Scripts/python.exe).Path

      - name: Update channel unit tests
        if: github.ref == 'refs/heads/cowork'
        run: |
          npm ci --prefix desktop
          node --test packaging/staging-app.test.cjs desktop/updater.test.cjs desktop/secureStore.test.cjs desktop/updatingWindow.test.cjs

      # The "Updating Tandem" window that shows while the installer runs
      # (desktop/updating.ps1), started exactly as Tandem starts it, through a
      # made-up update; it must really be on screen (a capture is kept).
      - name: The "Updating Tandem" window
        if: github.ref == 'refs/heads/cowork'
        timeout-minutes: 3
        run: node packaging/updating-window-check.cjs updating-window.png
      - uses: actions/upload-artifact@v4
        if: always() && github.ref == 'refs/heads/cowork'
        with:
          name: updating-window
          path: updating-window.png
          if-no-files-found: ignore

      - name: Name the staging app (installs beside Tandem, updates from windows-staging)
        id: staging
        if: github.ref == 'refs/heads/cowork'
        run: node packaging/staging-app.cjs desktop/package.json ${{ github.run_number }}

      - name: Build the installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npx electron-builder --win --publish never

      - name: Check the installer ("Open with" for every type of file)
        if: github.ref == 'refs/heads/cowork'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/open-with-check.ps1 (Resolve-Path desktop/release/Tandem-Setup-*.exe).Path

      - name: Check the desktop app
        shell: pwsh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          # A colourful test wallpaper, so the screenshot shows the desktop through the window glass.
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 1920, 1080
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $rect = New-Object System.Drawing.Rectangle 0, 0, 1920, 1080
          $grad = New-Object System.Drawing.Drawing2D.LinearGradientBrush $rect, ([System.Drawing.Color]::FromArgb(255, 30, 60, 140)), ([System.Drawing.Color]::FromArgb(255, 230, 120, 60)), 30
          $g.FillRectangle($grad, $rect)
          $g.FillEllipse([System.Drawing.Brushes]::Gold, 1300, 120, 360, 360)
          $g.FillEllipse([System.Drawing.Brushes]::MediumSeaGreen, 200, 650, 520, 520)
          $wall = Join-Path $env:RUNNER_TEMP "tandem-test-wallpaper.bmp"
          $bmp.Save($wall, [System.Drawing.Imaging.ImageFormat]::Bmp)
          Add-Type -Namespace Win32 -Name Desk -MemberDefinition '[DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern bool SystemParametersInfo(int a, int b, string c, int d);'
          [Win32.Desk]::SystemParametersInfo(20, 0, $wall, 3) | Out-Null
          # Windows' "Transparency effects" setting (needed for acrylic and Mica).
          New-Item -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Force | Out-Null
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name EnableTransparency -Value 1 -Type DWord
          Write-Output ("Windows build: " + [Environment]::OSVersion.Version)
          Start-Sleep -Seconds 2
          npm install --no-save "playwright@1.64.1"
          $exe = (Get-ChildItem desktop/release/win-unpacked/*.exe | Where-Object { $_.Name -like 'Tandem*.exe' } | Select-Object -First 1).FullName
          Write-Output "App: $exe"
          node packaging/desktop-smoke.cjs $exe (Resolve-Path smoke-project-env/Scripts/python.exe).Path desktop-screen.jpg

      - name: Check updates in an installed Tandem Staging
        if: github.ref == 'refs/heads/cowork'
        shell: pwsh
        env:
          VERSION: ${{ steps.staging.outputs.version }}
        run: |
          $setup = (Resolve-Path "desktop/release/Tandem-Setup-$env:VERSION.exe").Path
          node packaging/staging-update-smoke.cjs $setup $env:VERSION (Resolve-Path smoke-project-env/Scripts/python.exe).Path

      # main and tags: one zip with both exes (the release job downloads it by name).
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/cowork'
        with:
          name: Tandem-windows-x64
          path: |
            desktop/release/Tandem-Setup-*.exe
            desktop/release/Tandem-*-portable.exe
          retention-days: 30
          if-no-files-found: error

      # cowork (Tandem Staging): just the installer, not zipped, so the
      # artifact link downloads Tandem-Setup-<version>.exe itself.
      - name: Upload the staging installer (.exe, not zipped)
        if: github.ref == 'refs/heads/cowork'
        uses: actions/upload-artifact@v7
        with:
          path: desktop/release/Tandem-Setup-*.exe
          archive: false
          retention-days: 30
          if-no-files-found: error

      # cowork: the files for the update feed, for publish-staging.
      - name: Keep the update files
        if: github.ref == 'refs/heads/cowork'
        uses: actions/upload-artifact@v4
        with:
          name: windows-staging-feed
          path: |
            desktop/release/Tandem-Setup-${{ steps.staging.outputs.version }}.exe
            desktop/release/Tandem-Setup-${{ steps.staging.outputs.version }}.exe.blockmap
            desktop/release/staging.yml
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshot
          path: desktop-screen.jpg
          if-no-files-found: ignore

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tandem-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Tandem ${{ inputs.release_tag || github.ref_name }}
          files: |
            Tandem-Setup-*.exe
            Tandem-*-portable.exe
          generate_release_notes: true
          body: |
            Tandem for Windows, a desktop app. Download **Tandem-Setup** (installer) or the **portable** exe,
            start Tandem and choose a project folder. The window is glass over your own desktop
            (Windows 11: Frosted or Mica; Clear on any Windows); change it under ⋯ → Window glass.

            Needs Python 3.11 or newer installed for your project code (python.org or `winget install Python.Python.3.12`);
            Tandem uses the project's `.venv` when it has one.

            Code runs on your computer with your permissions. Tandem is a local runtime for your own projects, not a sandbox.
            The exe isn't code-signed yet, so Windows SmartScreen may ask you to confirm ("More info" → "Run anyway").

  # cowork: replace the files of the rolling prerelease windows-staging, the
  # feed installed copies of Tandem Staging update from. Only after every
  # build check has passed. Keeps the previous build's .blockmap (for
  # differential downloads) and removes older installers. Never "latest".
  publish-staging:
    name: Publish the staging update
    if: github.ref == 'refs/heads/cowork' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: windows-staging-feed
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: windows-staging
      VERSION: ${{ needs.build.outputs.staging_version }}
      FEED: https://github.com/M2-King/Tandem/releases/download/windows-staging
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging
      - uses: actions/download-artifact@v4
        with:
          name: windows-staging-feed
          path: feed

      - name: Check the update files
        run: node packaging/check-staging-feed.mjs feed "$VERSION"

      - name: Publish to the windows-staging prerelease
        id: publish
        run: |
          set -euo pipefail
          EXE="Tandem-Setup-${VERSION}.exe"
          NOTES="Tandem Staging for Windows ${VERSION} (cowork ${GITHUB_SHA::7}, run ${GITHUB_RUN_NUMBER}): the update feed for installed copies of Tandem Staging, replaced after every cowork build. Testers install it once from ${EXE}; later builds arrive inside the app. Not a release."
          prev=""
          if gh release view "$TAG" >/dev/null 2>&1; then
            prev=$(gh release download "$TAG" -p staging.yml -O - 2>/dev/null | sed -n 's/^version: *//p' | tr -d "'\"" || true)
          else
            gh release create "$TAG" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Tandem (Windows, staging feed)" --notes "$NOTES"
          fi
          echo "Feed now: ${prev:-empty}; this build: $VERSION"
          # A late run never replaces a newer build.
          if [ -n "$prev" ] && [ "$(printf '%s\n%s\n' "$prev" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
            echo "::notice::The feed already has $prev, newer than $VERSION; not replacing it."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The installer and its blockmap first, then the channel file that points at them.
          gh release upload "$TAG" "feed/$EXE" "feed/$EXE.blockmap" --clobber
          gh release upload "$TAG" feed/staging.yml --clobber
          keep=("$EXE" "$EXE.blockmap" "staging.yml")
          [ -n "$prev" ] && [ "$prev" != "$VERSION" ] && keep+=("Tandem-Setup-${prev}.exe.blockmap")
          gh release view "$TAG" --json assets -q '.assets[].name' | while read -r name; do
            if ! printf '%s\n' "${keep[@]}" | grep -qxF "$name"; then
              echo "Removing $name"
              gh release delete-asset "$TAG" "$name" -y
            fi
          done
          gh release edit "$TAG" --prerelease --latest=false --notes "$NOTES"
          gh release view "$TAG" --json isPrerelease,assets -q '"prerelease: \(.isPrerelease)", (.assets[] | "  \(.name)  \(.size) bytes")'
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Check the feed
        if: steps.publish.outputs.published == 'true'
        run: node packaging/check-staging-feed.mjs feed "$VERSION" "$FEED"

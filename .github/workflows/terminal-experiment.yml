name: Terminal check (temporary)
on:
  push:
    branches: [claude/tandem-cowork-staging-verify-7kd94b]
    paths: [runtime/tandem_runtime/terminals.py, runtime/tests/test_terminals.py, .github/workflows/terminal-experiment.yml]
jobs:
  try:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q -e "runtime[test]"
      - run: python -m pytest -q -x runtime/tests/test_terminals.py

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Sunset over a mountain lake, seen from a dark wooden deck.
       Warm light comes from behind the mountain on the left; the sky to the right stays cool. -->
  <defs>
    <!-- The sample image is painted soft, like a photo with shallow depth of field.
         Tandem never blurs a wallpaper itself. -->
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232b3c"/>
      <stop offset="0.22" stop-color="#303849"/>
      <stop offset="0.4" stop-color="#4d4e5d"/>
      <stop offset="0.5" stop-color="#8a7172"/>
      <stop offset="0.56" stop-color="#c79a80"/>
      <stop offset="0.6" stop-color="#e2b18a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.1" cy="0.32" r="0.44">
      <stop offset="0" stop-color="#ffdcb0" stop-opacity="1"/>
      <stop offset="0.22" stop-color="#f0b88e" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#c98f78" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#c98f78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coolRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="#1f293b" stop-opacity="0"/>
      <stop offset="1" stop-color="#1f293b" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4855"/>
      <stop offset="1" stop-color="#2b2c36"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5662"/>
      <stop offset="1" stop-color="#6b6066"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99b80"/>
      <stop offset="0.2" stop-color="#8a7375"/>
      <stop offset="0.6" stop-color="#4c4a56"/>
      <stop offset="1" stop-color="#363744"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f2724"/>
      <stop offset="1" stop-color="#17120f"/>
    </linearGradient>
    <radialGradient id="glint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0b583" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f0b583" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>
  <rect width="1600" height="600" fill="url(#coolRight)"/>

  <g filter="url(#soft)">
  <!-- far hills on the horizon -->
  <path d="M560 600 L700 584 L860 592 L1000 572 L1140 586 L1300 566 L1460 580 L1600 570 L1600 604 L560 604 Z" fill="url(#far)"/>
  <!-- the big mountain on the left, with a sunlit ridge -->
  <path d="M0 410 L70 388 L150 400 L250 446 L360 500 L480 548 L600 586 L700 604 L0 604 Z" fill="url(#mountain)"/>
  <path d="M0 410 L70 388 L150 400 L250 446 L360 500 L480 548 L600 586" fill="none" stroke="#f2c49a" stroke-opacity="0.7" stroke-width="3"/>

  <!-- lake -->
  <rect y="604" width="1600" height="196" fill="url(#lake)"/>
  <path d="M0 604 L700 604 L560 628 L330 668 L120 700 L0 712 Z" fill="#2c2d37" opacity="0.65"/>
  <g stroke="#f3cf9f" stroke-linecap="round" opacity="0.45">
    <path d="M140 640h220" stroke-width="2"/>
    <path d="M90 664h300" stroke-width="1.6"/>
    <path d="M200 690h180" stroke-width="1.4"/>
    <path d="M60 724h360" stroke-width="1.2" opacity="0.7"/>
    <path d="M640 640h160" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- wooden deck in the foreground, catching the light -->
  <rect y="800" width="1600" height="200" fill="url(#deck)"/>
  <path d="M0 800 H1600" stroke="#8a6650" stroke-opacity="0.5" stroke-width="2"/>
  <ellipse cx="40" cy="930" rx="320" ry="70" fill="url(#glint)"/>
  <ellipse cx="520" cy="955" rx="220" ry="34" fill="url(#glint)" opacity="0.5"/>
  <ellipse cx="1140" cy="958" rx="200" ry="30" fill="url(#glint)" opacity="0.45"/>
  </g>
</svg>

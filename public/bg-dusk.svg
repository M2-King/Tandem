<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2036"/>
      <stop offset="0.2" stop-color="#3a3550"/>
      <stop offset="0.38" stop-color="#8a5a4e"/>
      <stop offset="0.5" stop-color="#d98a42"/>
      <stop offset="0.62" stop-color="#f6bd62"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.62" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#ffe6a8" stop-opacity="1"/>
      <stop offset="0.12" stop-color="#ffc56b" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#f08a3c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f08a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4904a"/>
      <stop offset="0.25" stop-color="#7a4d3a"/>
      <stop offset="1" stop-color="#0d1019"/>
    </linearGradient>
    <radialGradient id="glint" cx="0.62" cy="0" r="0.5">
      <stop offset="0" stop-color="#ffd58a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffd58a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7e5a5a"/><stop offset="1" stop-color="#a26a4c"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3843"/><stop offset="1" stop-color="#5e4038"/>
    </linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22202c"/><stop offset="1" stop-color="#1a1820"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>
  <circle cx="992" cy="600" r="38" fill="#fff1c9" opacity="0.95"/>
  <!-- far range -->
  <path d="M0 560 L120 520 L210 540 L330 470 L420 505 L520 455 L640 520 L760 480 L860 530 L960 560 L1080 500 L1180 470 L1290 515 L1400 480 L1500 525 L1600 500 L1600 620 L0 620 Z" fill="url(#m1)" opacity="0.75"/>
  <!-- mid range -->
  <path d="M0 590 L90 560 L180 575 L300 505 L360 530 L450 490 L560 560 L700 585 L820 570 L900 600 L1040 610 L1160 560 L1240 520 L1330 560 L1440 530 L1530 570 L1600 555 L1600 625 L0 625 Z" fill="url(#m2)" opacity="0.9"/>
  <!-- near ridges -->
  <path d="M0 520 L70 470 L150 500 L230 430 L300 480 L380 560 L460 600 L560 618 L0 625 Z" fill="url(#m3)"/>
  <path d="M1600 470 L1520 440 L1440 500 L1380 470 L1300 560 L1220 600 L1120 620 L1600 625 Z" fill="url(#m3)"/>
  <!-- lake -->
  <rect y="620" width="1600" height="380" fill="url(#lake)"/>
  <ellipse cx="992" cy="625" rx="420" ry="190" fill="url(#glint)"/>
  <g stroke="#ffe0a0" stroke-linecap="round" opacity="0.55">
    <path d="M950 640h84" stroke-width="3"/>
    <path d="M930 662h120" stroke-width="2.5"/>
    <path d="M960 686h66" stroke-width="2.5"/>
    <path d="M900 712h170" stroke-width="2"/>
    <path d="M945 742h90" stroke-width="2"/>
    <path d="M880 780h210" stroke-width="1.5" opacity="0.7"/>
    <path d="M930 822h120" stroke-width="1.5" opacity="0.6"/>
  </g>
  <!-- shore reflections of ridges -->
  <path d="M0 625 L560 625 L460 650 L300 690 L150 660 L0 700 Z" fill="#14131b" opacity="0.65"/>
  <path d="M1600 625 L1120 625 L1260 655 L1380 700 L1500 670 L1600 720 Z" fill="#14131b" opacity="0.65"/>
</svg>

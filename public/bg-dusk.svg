<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Twilight over a lake: cool sky, warm light only low on the horizon -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3650"/>
      <stop offset="0.35" stop-color="#3c475f"/>
      <stop offset="0.58" stop-color="#4a5163"/>
      <stop offset="0.7" stop-color="#6a5f60"/>
      <stop offset="0.77" stop-color="#b48a63"/>
      <stop offset="0.8" stop-color="#d9a86e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.58" cy="0.8" r="0.36">
      <stop offset="0" stop-color="#f3c88a" stop-opacity="0.75"/>
      <stop offset="0.25" stop-color="#d99a5e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d99a5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a98060"/>
      <stop offset="0.18" stop-color="#5d5258"/>
      <stop offset="0.55" stop-color="#3a3e4a"/>
      <stop offset="1" stop-color="#2a2d36"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4e5e"/>
      <stop offset="1" stop-color="#5e5a62"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454a5b"/>
      <stop offset="1" stop-color="#363a48"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a8fa0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8a8fa0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8a8fa0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- thin cloud bands -->
  <ellipse cx="1000" cy="300" rx="620" ry="34" fill="url(#cloud)"/>
  <ellipse cx="560" cy="420" rx="520" ry="26" fill="url(#cloud)"/>
  <ellipse cx="1180" cy="520" rx="480" ry="20" fill="url(#cloud)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <!-- far hills on the horizon -->
  <path d="M0 770 L160 745 L300 760 L470 735 L620 758 L760 748 L900 770 L1040 752 L1200 762 L1340 742 L1480 760 L1600 750 L1600 800 L0 800 Z" fill="url(#far)" opacity="0.85"/>
  <!-- large mountain on the left, smaller ridge on the right -->
  <path d="M0 330 L70 300 L150 360 L230 420 L300 470 L380 560 L470 650 L560 720 L640 775 L700 800 L0 800 Z" fill="url(#near)"/>
  <path d="M1600 560 L1530 580 L1460 640 L1380 700 L1300 760 L1240 800 L1600 800 Z" fill="url(#near)" opacity="0.9"/>
  <!-- lake -->
  <rect y="800" width="1600" height="200" fill="url(#lake)"/>
  <ellipse cx="930" cy="806" rx="360" ry="70" fill="#f0c387" opacity="0.18"/>
  <g stroke="#f2cf98" stroke-linecap="round" opacity="0.4">
    <path d="M880 818h110" stroke-width="2"/>
    <path d="M850 836h170" stroke-width="1.6"/>
    <path d="M900 856h90" stroke-width="1.4"/>
    <path d="M820 880h240" stroke-width="1.2" opacity="0.7"/>
  </g>
  <!-- reflections of the mountains -->
  <path d="M0 800 L700 800 L600 840 L420 900 L200 950 L0 980 Z" fill="#2a2e3a" opacity="0.7"/>
  <path d="M1600 800 L1240 800 L1340 840 L1480 880 L1600 900 Z" fill="#2a2e3a" opacity="0.6"/>
</svg>
